<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Umbra">
  <title>Umbra</title>
  <defs>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4de0d6"/>
      <stop offset="55%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#a48bff"/>
    </linearGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#4de0d6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4de0d6" stop-opacity=".5"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07090e"/>
  <circle cx="32" cy="32" r="24" fill="url(#corona)"/>
  <!-- the light source, and the umbral body occluding it -->
  <circle cx="32" cy="32" r="20" fill="url(#rim)"/>
  <circle cx="35" cy="29" r="16" fill="#07090e"/>
</svg>
